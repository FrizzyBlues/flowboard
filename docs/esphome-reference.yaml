# Reference ESPHome config for a Flowboard-controlled vent.
# Pair with the 3D-printable hardware: https://makerworld.com/en/models/1444859-ac-vent-control#profileId-1504428
#
# NOTE: This file contains placeholder credentials. Replace:
#   - api encryption key  (generate per-device in ESPHome Builder)
#   - ota password        (generate per-device)
#   - manual_ip addresses (match your network)
#   - ap password         (fallback hotspot)
# WiFi and MQTT credentials come from your ESPHome secrets (wifi_ssid, wifi_password,
# mqtt_broker, mqtt_username, mqtt_password).

esphome:
  name: study-room-vent-1          # naming convention: <room>-vent-<n>
  friendly_name: Study Room Vent 1

esp8266:
  board: d1_mini

substitutions:
  room_name: study_room            # becomes the entity prefix switch.${room_name}_vent_1_vent_switch
  device_type: ac-vent
  device_name: vent-1

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "REPLACE_WITH_GENERATED_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_GENERATED_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Static IP recommended for esp8266 — faster connection after power loss
  manual_ip:
    static_ip: 192.168.0.10
    gateway: 192.168.0.1
    subnet: 255.255.255.0

  # Fallback hotspot (captive portal) if wifi connection fails
  ap:
    ssid: "Study-Room-Vent-1"
    password: "REPLACE_WITH_HOTSPOT_PASSWORD"

# Servo (PWM on D4 / GPIO2)
output:
  - platform: esp8266_pwm
    id: pwm_output
    frequency: 50 Hz
    pin: D4

servo:
  - id: vent_servo
    output: pwm_output

# Optional MQTT control (status publishes + OPEN/CLOSE topics)
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: False
  discover_ip: False
  on_message:
    - topic: "${room_name}/${device_type}/${device_name}/control"
      payload: "OPEN"
      then:
        - switch.turn_on: vent_switch
    - topic: "${room_name}/${device_type}/${device_name}/control"
      payload: "CLOSE"
      then:
        - switch.turn_off: vent_switch

# Servo position state (restored across reboots)
globals:
  - id: vent_open_position
    type: float
    restore_value: yes
    initial_value: "-0.50"

  - id: vent_closed_position
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: vent_min_position
    type: float
    restore_value: no
    initial_value: "-1.0"

  - id: vent_max_position
    type: float
    restore_value: no
    initial_value: "1.0"

# Tunable endpoints exposed to Home Assistant (Flowboard calibration edits these)
number:
  - platform: template
    name: "Set Open Position"
    id: vent_open_pos
    optimistic: true
    restore_value: true
    min_value: -1.0
    max_value: 1.0
    step: 0.01
    initial_value: -0.50
    set_action:
      - globals.set:
          id: vent_open_position
          value: !lambda |
            if (x < id(vent_min_position)) return id(vent_min_position);
            if (x > id(vent_max_position)) return id(vent_max_position);
            return x;

  - platform: template
    name: "Set Closed Position"
    id: vent_closed_pos
    optimistic: true
    restore_value: true
    min_value: -1.0
    max_value: 1.0
    step: 0.01
    initial_value: 0.0
    set_action:
      - globals.set:
          id: vent_closed_position
          value: !lambda |
            if (x < id(vent_min_position)) return id(vent_min_position);
            if (x > id(vent_max_position)) return id(vent_max_position);
            return x;

# The vent state switch (Flowboard toggles this)
switch:
  - platform: template
    name: "Vent Switch"
    optimistic: true
    restore_mode: ALWAYS_ON
    id: vent_switch
    discovery: false
    turn_on_action:
      - servo.write:
          id: vent_servo
          level: !lambda 'return id(vent_open_position);'
      - mqtt.publish:
          topic: "${room_name}/${device_type}/${device_name}/status"
          payload: "OPENED"
    turn_off_action:
      - servo.write:
          id: vent_servo
          level: !lambda 'return id(vent_closed_position);'
      - mqtt.publish:
          topic: "${room_name}/${device_type}/${device_name}/status"
          payload: "CLOSED"
