name: Check comment

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read

jobs:
  dispatch:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/check')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI on the pull request head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          body="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$body" != "/check" ]]; then
            echo "Ignoring comment; body is not exactly /check"
            exit 0
          fi

          meta="$(gh api "repos/${REPO}/pulls/${PR}")"
          draft="$(jq -r '.draft' <<<"$meta")"
          base="$(jq -r '.base.ref' <<<"$meta")"
          head_ref="$(jq -r '.head.ref' <<<"$meta")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$meta")"

          if [[ "$draft" == "true" ]]; then
            echo "Ignoring /check on a draft pull request"
            exit 0
          fi

          if [[ "$base" != "main" ]]; then
            echo "Ignoring /check; base branch is ${base}, not main"
            exit 0
          fi

          if [[ "$head_repo" != "$REPO" ]]; then
            echo "Ignoring /check; pull request head is a fork (${head_repo})"
            exit 0
          fi

          gh workflow run ci.yml --repo "$REPO" --ref "$head_ref"
